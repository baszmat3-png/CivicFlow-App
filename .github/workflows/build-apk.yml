name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CivicFlow.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CivicFlow.apk \
            --title "CivicFlow APK" \
            --notes "أحدث نسخة من تطبيق CivicFlow لأندرويد. حمّل CivicFlow.apk وثبّته." \
            --target "${{ github.sha }}"

      - uses: actions/upload-artifact@v4
        with:
          name: CivicFlow-apk
          path: CivicFlow.apk
